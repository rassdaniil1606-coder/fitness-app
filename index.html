<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hard Work | App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            background-color: #000;
            /* Используем твою картинку и добавляем сильное затемнение по краям для фокуса в центр */
            background-image: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), url('IMG_20260217_105959_349.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, #a020f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .tariff-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        /* Эффект матового стекла + фиолетовый неон */
        .tariff-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(160, 32, 240, 0.4);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.1);
        }

        .tariff-card h2 {
            margin: 0;
            font-size: 20px;
            color: #fff;
        }

        .price {
            font-size: 24px;
            font-weight: 900;
            color: #a020f0;
            margin: 10px 0;
            display: block;
            text-shadow: 0 0 10px rgba(160, 32, 240, 0.5);
        }

        .btn-buy {
            background: #a020f0;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.4);
        }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .m-content {
            background: #000;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #a020f0;
            width: 80%;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ВЫБЕРИ ТАРИФ</h1>
    </div>

    <div class="tariff-container">
        <div class="tariff-card">
            <h2>ЛАЙТ</h2>
            <span class="price">1000₽</span>
            <button class="btn-buy" onclick="openM('ЛАЙТ')">ВЫБРАТЬ</button>
        </div>

        <div class="tariff-card">
            <h2>ПРО</h2>
            <span class="price">2500₽</span>
            <button class="btn-buy" onclick="openM('ПРО')">ВЫБРАТЬ</button>
        </div>

        <div class="tariff-card">
            <h2>МАКС</h2>
            <span class="price">5000₽</span>
            <button class="btn-buy" onclick="openM('МАКС')">ВЫБРАТЬ</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="m-content">
            <h2 id="mT" style="color:#a020f0"></h2>
            <input type="text" id="uN" placeholder="ИМЯ">
            <input type="email" id="uE" placeholder="EMAIL">
            <button class="btn-buy" onclick="send()">ОПЛАТИТЬ</button>
            <p onclick="closeM()" style="margin-top:15px; color:#555">Назад</p>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let curT = "";
        tg.expand();

        function openM(t) {
            curT = t;
            document.getElementById('mT').innerText = t;
            document.getElementById('modal').style.display = 'flex';
            tg.HapticFeedback.impactOccurred('medium');
        }

        function closeM() { document.getElementById('modal').style.display = 'none'; }

        function send() {
            let n = document.getElementById('uN').value;
            let e = document.getElementById('uE').value;
            if(!n || !e) return alert("Заполни поля!");
            tg.sendData(JSON.stringify({tariff: curT, name: n, email: e}));
            tg.close();
        }
    </script>
</body>
</html>
